# Zet de export uit public/ via FTPS op een webserver (bijv. SiteGround).
# Kopieer naar .github/workflows/deploy-ftp.yml in je repository.
#
# Secrets (Settings → Secrets and variables → Actions → Secrets):
#   FTP_SERVER     Hostnaam waarop het TLS-certificaat van de FTP-server
#                  staat. Bij SiteGround de servernaam, bijv. c118233.sgvps.net
#                  (te zien met: openssl s_client -starttls ftp -connect <domein>:21)
#   FTP_USERNAME
#   FTP_PASSWORD
#
# Variables (zelfde pagina, tabblad Variables):
#   SITE_URL        Adres waar de site komt te staan.
#                   - Test, bijv. https://static.fifthelement.nl
#                     → links worden omgezet naar dit adres, elke pagina krijgt
#                       noindex en robots.txt blokkeert zoekmachines.
#                   - Live: https://fifthelement.nl
#                     → de export gaat ongewijzigd online.
#                   Zolang SITE_URL leeg is, doet deze workflow niets.
#   FTP_SERVER_DIR  Map op de server, gezien vanuit de FTP-account.
#                   Standaard de map waarin de FTP-account uitkomt.
#
# Uploaden gebeurt met lftp (FTPS met certificaatcontrole). Bestandsdatums
# komen uit de git-geschiedenis, zodat na de eerste keer alleen gewijzigde
# bestanden worden geüpload. Bestanden die uit de export verdwijnen worden
# ook op de server verwijderd, behalve .htaccess, .well-known/ en cgi-bin/.
# Gebruik daarom een FTP-account die alleen in de map van deze site kan.

name: Deploy via FTP

on:
  push:
    branches: [main]
    paths: ['public/**']
  workflow_dispatch:

concurrency:
  group: deploy-ftp
  cancel-in-progress: false

env:
  LIVE_URL: https://fifthelement.nl

jobs:
  deploy:
    if: ${{ vars.SITE_URL != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Hulpmiddelen en bestandsdatums
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lftp git-restore-mtime > /dev/null
          git restore-mtime public

      - name: Export voorbereiden
        shell: bash
        env:
          SITE_URL: ${{ vars.SITE_URL }}
        run: |
          set -euo pipefail
          cp -a public _deploy
          if [ "${SITE_URL%/}" = "${LIVE_URL%/}" ]; then
            echo "Doel is de live site ($SITE_URL): export gaat ongewijzigd online."
            exit 0
          fi
          echo "Testdoel: $LIVE_URL -> $SITE_URL (met noindex)"
          export PAGES_URL="$SITE_URL"
          find _deploy -type f \( -name '*.html' -o -name '*.css' -o -name '*.js' -o -name '*.json' -o -name '*.xml' -o -name '*.txt' -o -name '*.svg' \) -print0 |
            xargs -0 perl -pi -e '
              BEGIN {
                ($l = $ENV{LIVE_URL})  =~ s{/+$}{};
                ($p = $ENV{PAGES_URL}) =~ s{/+$}{};
                ($le = $l) =~ s{/}{\x5c/}g;   # https:\/\/...
                ($pe = $p) =~ s{/}{\x5c/}g;
                ($bp = $p) =~ s{^https?://[^/]+}{};
              }
              next if /rel=["\x27]canonical["\x27]/;
              s/\Q$l\E/$p/g;
              s/\Q$le\E/$pe/g;
              if ($bp ne "") {
                s{(\b(?:href|src|action|poster)=["\x27])/(?!/)}{$1$bp/}g;
                s{(url\(["\x27]?)/(?!/)}{$1$bp/}g;
              }
            '
          find _deploy -name '*.html' -print0 |
            xargs -0 perl -pi -e 's/<head(\s[^>]*)?>/$&<meta name="robots" content="noindex, nofollow">/i'
          printf 'User-agent: *\nDisallow: /\n' > _deploy/robots.txt
          # Datums gelijk houden aan de export, anders lijkt alles gewijzigd.
          (cd public && find . -type f -print0) | while IFS= read -r -d '' f; do
            touch -r "public/$f" "_deploy/$f"
          done

      - name: Upload via FTPS (lftp)
        shell: bash
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          LFTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          TARGET_DIR: ${{ vars.FTP_SERVER_DIR || '.' }}
        run: |
          set -euo pipefail
          lftp -c "
            set cmd:fail-exit yes
            set ftp:ssl-force true
            set ftp:ssl-protect-data true
            set ssl:verify-certificate true
            set net:timeout 30
            set net:max-retries 3
            set net:reconnect-interval-base 5
            set mirror:parallel-transfer-count 4
            open --env-password -u '$FTP_USERNAME' 'ftp://$FTP_SERVER'
            mirror --reverse --delete --only-newer --no-perms --verbose=1 \
              --exclude-glob .htaccess \
              --exclude-glob .well-known/ \
              --exclude-glob cgi-bin/ \
              --exclude-glob .ftp-deploy-sync-state.json \
              _deploy/ '$TARGET_DIR'
          "
