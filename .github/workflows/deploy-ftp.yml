# Zet de export uit public/ via FTPS op een webserver (bijv. SiteGround).
# Kopieer naar .github/workflows/deploy-ftp.yml in je repository.
#
# Secrets (Settings → Secrets and variables → Actions → Secrets):
#   FTP_SERVER     Hostnaam waarop het TLS-certificaat van de FTP-server
#                  staat. Bij SiteGround de servernaam, bijv. c118233.sgvps.net
#                  (te zien met: openssl s_client -starttls ftp -connect <domein>:21)
#   FTP_USERNAME
#   FTP_PASSWORD
#
# Variables (zelfde pagina, tabblad Variables):
#   SITE_URL        Adres waar de site komt te staan.
#                   - Test, bijv. https://static.fifthelement.nl
#                     → links worden omgezet naar dit adres, elke pagina krijgt
#                       noindex en robots.txt blokkeert zoekmachines.
#                   - Live: https://fifthelement.nl
#                     → de export gaat ongewijzigd online.
#                   Zolang SITE_URL leeg is, doet deze workflow niets.
#   FTP_SERVER_DIR  Map op de server, gezien vanuit de FTP-account.
#                   Standaard de map waarin de FTP-account uitkomt.
#
# Uploaden gebeurt met lftp (FTPS met certificaatcontrole). Op de server staat
# .static-push-manifest met een SHA-1 per bestand; daarmee worden na de eerste
# keer alleen bestanden geüpload waarvan de inhoud echt veranderd is, en alleen
# bestanden verwijderd die uit de export verdwenen zijn. De eerste keer (geen
# manifest) wordt alles gespiegeld; .htaccess, .well-known/ en cgi-bin/ blijven
# dan altijd staan.
# Gebruik daarom een FTP-account die alleen in de map van deze site kan.

name: Deploy via FTP

on:
  push:
    branches: [main]
    paths: ['public/**']
  workflow_dispatch:

concurrency:
  group: deploy-ftp
  cancel-in-progress: false

env:
  LIVE_URL: https://fifthelement.nl

jobs:
  deploy:
    if: ${{ vars.SITE_URL != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: lftp installeren
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lftp > /dev/null

      - name: Export voorbereiden
        shell: bash
        env:
          SITE_URL: ${{ vars.SITE_URL }}
        run: |
          set -euo pipefail
          cp -a public _deploy
          if [ "${SITE_URL%/}" = "${LIVE_URL%/}" ]; then
            echo "Doel is de live site ($SITE_URL): export gaat ongewijzigd online."
            exit 0
          fi
          echo "Testdoel: $LIVE_URL -> $SITE_URL (met noindex)"
          export PAGES_URL="$SITE_URL"
          find _deploy -type f \( -name '*.html' -o -name '*.css' -o -name '*.js' -o -name '*.json' -o -name '*.xml' -o -name '*.txt' -o -name '*.svg' \) -print0 |
            xargs -0 perl -0777 -pi -e '
              BEGIN {
                ($l = $ENV{LIVE_URL})  =~ s{/+$}{};
                ($p = $ENV{PAGES_URL}) =~ s{/+$}{};
                ($le = $l) =~ s{/}{\x5c/}g;   # https:\/\/...
                ($pe = $p) =~ s{/}{\x5c/}g;
                ($bp = $p) =~ s{^https?://[^/]+}{};
              }
              # Canonical-links blijven naar de live site wijzen (per bestand,
              # want verkleinde HTML staat vaak op een paar lange regels).
              my @keep;
              s{<link\b[^>]*\brel=["\x27]?canonical\b[^>]*>}{push @keep, $&; "\x00SPKEEP" . $#keep . "\x00"}ge;
              s/\Q$l\E/$p/g;
              s/\Q$le\E/$pe/g;
              if ($bp ne "") {
                s{(\b(?:href|src|action|poster)=["\x27])/(?!/)}{$1$bp/}g;
                s{(url\(["\x27]?)/(?!/)}{$1$bp/}g;
              }
              s{\x00SPKEEP(\d+)\x00}{$keep[$1]}g;
            '
          find _deploy -name '*.html' -print0 |
            xargs -0 perl -pi -e 's/<head(\s[^>]*)?>/$&<meta name="robots" content="noindex, nofollow">/i'
          printf 'User-agent: *\nDisallow: /\n' > _deploy/robots.txt

      - name: Upload via FTPS (lftp)
        shell: bash
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          LFTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          TARGET_DIR: ${{ vars.FTP_SERVER_DIR || '.' }}
        run: |
          set -euo pipefail
          MANIFEST=.static-push-manifest
          SETTINGS="set cmd:fail-exit yes; set ftp:ssl-force true; set ftp:ssl-protect-data true;
            set ssl:verify-certificate true; set net:timeout 30; set net:max-retries 3;
            set net:reconnect-interval-base 5; set mirror:parallel-transfer-count 6"
          OPEN="open --env-password -u '$FTP_USERNAME' 'ftp://$FTP_SERVER'"

          # Vingerafdrukken van de nieuwe export.
          (cd _deploy && find . -type f -print0 | sort -z | xargs -0 sha1sum | sed -E 's#^([0-9a-f]{40}) [ *]\./#\1  #') > new.manifest

          # Manifest van de vorige deploy ophalen (bestaat niet bij de eerste keer).
          if lftp -c "$SETTINGS; $OPEN; get '$TARGET_DIR/$MANIFEST' -o old.manifest" 2>/dev/null; then
            # Alleen wat echt veranderd of verdwenen is.
            comm -13 <(sort old.manifest) <(sort new.manifest) | cut -c43- > upload.txt
            comm -23 <(cut -c43- old.manifest | sort) <(cut -c43- new.manifest | sort) > delete.txt
            echo "Gewijzigd/nieuw: $(wc -l < upload.txt), te verwijderen: $(wc -l < delete.txt)"
            {
              echo "$SETTINGS"
              echo "$OPEN"
              while IFS= read -r f; do
                d=$(dirname "$f")
                [ "$d" != "." ] && echo "mkdir -p -f '$TARGET_DIR/$d'"
                echo "put '_deploy/$f' -o '$TARGET_DIR/$f'"
              done < upload.txt
              while IFS= read -r f; do
                echo "rm -f '$TARGET_DIR/$f'"
              done < delete.txt
              echo "put new.manifest -o '$TARGET_DIR/$MANIFEST'"
            } > script.lftp
            if [ -s upload.txt ] || [ -s delete.txt ]; then
              lftp -f script.lftp
            else
              echo "Niets gewijzigd."
            fi
          else
            echo "Geen manifest op de server: eerste volledige upload."
            lftp -c "$SETTINGS; $OPEN
              mirror --reverse --delete --no-perms --verbose=1 \
                --exclude-glob .htaccess \
                --exclude-glob .well-known/ \
                --exclude-glob cgi-bin/ \
                --exclude-glob $MANIFEST \
                _deploy/ '$TARGET_DIR'
              put new.manifest -o '$TARGET_DIR/$MANIFEST'"
          fi
